name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: node build.mjs
      - name: Firefox アドオンとしての検証（web-ext lint）
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --warnings-as-errors=false
